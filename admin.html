
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b18">
<title>WORLD AT ARMS | Supreme Command</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#070b18;--panel:rgba(16,25,47,.82);--panel2:#111d35;
 --line:rgba(130,170,255,.15);--text:#eaf1ff;--muted:#91a4c5;
 --blue:#55a7ff;--cyan:#49e2df;--purple:#9d7cff;
 --green:#35d6a0;--red:#ff647c;--gold:#ffca70;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Vazirmatn,sans-serif;min-height:100vh;overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;z-index:-3;
 background:
 radial-gradient(ellipse at 15% 15%,#18376c 0,transparent 38%),
 radial-gradient(ellipse at 85% 70%,#321b63 0,transparent 40%),
 linear-gradient(140deg,#060a17,#0b1429 55%,#090d1c);
}
#space{position:fixed;inset:0;z-index:-2;pointer-events:none}
.orb{
 position:fixed;width:380px;height:380px;border-radius:50%;
 filter:blur(100px);opacity:.14;z-index:-1;pointer-events:none;
 animation:float 17s ease-in-out infinite alternate
}
.orb.one{background:#167bff;top:-150px;left:-100px}
.orb.two{background:#9b50ff;bottom:-180px;right:-100px;animation-delay:-8s}
@keyframes float{to{transform:translate(100px,80px) scale(1.3)}}
*{scrollbar-width:thin;scrollbar-color:#345078 transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{
 width:min(440px,100%);padding:34px;border:1px solid var(--line);
 border-radius:26px;background:rgba(12,21,41,.86);
 box-shadow:0 25px 100px #0008;backdrop-filter:blur(20px)
}
.logo{
 width:65px;height:65px;display:grid;place-items:center;
 border-radius:20px;background:linear-gradient(135deg,#237be9,#8e67ff);
 box-shadow:0 0 35px #438fff66;font-size:30px;font-weight:900
}
h1,h2,h3,p{margin-top:0}
.login h1{font-size:23px;margin:20px 0 5px}
.muted{color:var(--muted);font-size:12px}
.field{display:grid;gap:7px;margin:15px 0}
.field label{font-size:12px;color:#b9c9e6}
input,select,textarea{
 width:100%;padding:12px 13px;border-radius:12px;
 border:1px solid var(--line);background:#0b152a;color:var(--text);
 outline:none;min-width:0
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55a7ff18}
option{background:#101b31}
.btn{
 border:1px solid var(--line);border-radius:11px;padding:10px 14px;
 background:#172641;color:#dceaff;font-weight:700;transition:.2s
}
.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(120deg,#2679e8,#7459d9);border:0;color:white}
.btn.good{background:#123b36;color:#5df0bd;border-color:#287c68}
.btn.danger{background:#401c2b;color:#ff8294;border-color:#7c3449}
.btn.gold{background:#40331d;color:#ffd17a;border-color:#775c2b}
.btn.small{padding:6px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.shell{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}
.side{
 position:sticky;top:0;height:100vh;padding:20px 14px;
 background:rgba(7,14,29,.88);border-left:1px solid var(--line);
 backdrop-filter:blur(20px);z-index:10;overflow:auto
}
.brand{display:flex;align-items:center;gap:12px;padding:3px 8px 24px}
.brand .logo{width:43px;height:43px;font-size:20px;border-radius:14px}
.brand strong{display:block;font-size:13px;letter-spacing:1px}
.brand small{color:var(--cyan);font-size:9px;letter-spacing:2px}
.nav{display:grid;gap:5px}
.nav button{
 border:1px solid transparent;background:transparent;color:#9aaccb;
 text-align:right;padding:11px 12px;border-radius:12px;font-size:12px
}
.nav button:hover,.nav button.active{
 background:linear-gradient(90deg,#1b3c67aa,#192846);
 border-color:#4b91e455;color:#fff
}
.nav button span{display:inline-block;width:29px;font-size:15px}
.side-foot{margin-top:25px}
.main{padding:25px;min-width:0}
.top{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;margin-bottom:22px;flex-wrap:wrap
}
.top h1{font-size:22px;margin:0}
.top p{font-size:11px;color:var(--muted);margin:4px 0 0}
.top-actions{display:flex;gap:8px;align-items:center}
.connection{
 font-size:10px;padding:7px 10px;border:1px solid var(--line);
 border-radius:30px;color:var(--green)
}
.mobile-menu{display:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}
.stat,.panel{
 background:linear-gradient(145deg,rgba(19,34,61,.9),rgba(12,22,42,.88));
 border:1px solid var(--line);border-radius:18px;
 box-shadow:0 15px 40px #0002;backdrop-filter:blur(12px)
}
.stat{padding:17px;position:relative;overflow:hidden}
.stat:after{
 content:"";position:absolute;width:80px;height:80px;border-radius:50%;
 background:#398cff12;left:-20px;top:-25px
}
.stat .cap{color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:27px;margin-top:8px}
.panel{padding:17px;margin-bottom:15px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel h2{font-size:14px;margin:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:130px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}
th{text-align:right;color:#91a8cd;background:#101d34;font-weight:700}
td,th{padding:12px 10px;border-bottom:1px solid #ffffff0d}
tbody tr:hover{background:#ffffff08}
.pill{display:inline-block;padding:4px 9px;border-radius:30px;font-size:10px;background:#1a3454;color:#9dcaff}
.green{background:#123c35;color:#58e5b4}
.red{background:#451e2d;color:#ff8397}
.gold{background:#43351f;color:#ffd17a}
.empty,.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.notice{padding:12px;border:1px solid #8e713b55;background:#3a2e1b66;border-radius:12px;color:#eac67e;font-size:11px;margin:12px 0}
.toast{
 position:fixed;bottom:20px;left:20px;z-index:99;
 padding:13px 18px;border-radius:13px;background:#172b49;
 border:1px solid #4d83c5;color:white;box-shadow:0 10px 40px #0008;
 max-width:90vw;font-size:12px
}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{
 position:fixed;inset:0;background:#020610c9;z-index:50;
 display:grid;place-items:center;padding:15px;backdrop-filter:blur(8px)
}
.modal{
 width:min(520px,100%);max-height:90vh;overflow:auto;
 padding:22px;border:1px solid var(--line);border-radius:20px;
 background:#101d35;box-shadow:0 30px 100px #000b
}
.modal h2{font-size:17px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.search{max-width:230px}
.mobile-overlay{display:none}
.diamond-value{color:#ffd17a;font-weight:900}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;right:0;top:0;width:260px;transform:translateX(110%);transition:.25s}
 .side.open{transform:translateX(0)}
 .mobile-menu{display:inline-block}
 .main{padding:16px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mobile-overlay.show{display:block;position:fixed;inset:0;background:#0009;z-index:8}
}
@media(max-width:550px){
 .main{padding:12px}
 .top h1{font-size:18px}
 .stats{gap:8px}
 .stat{padding:12px}
 .stat strong{font-size:22px}
 .panel{padding:12px}
 .grid2{grid-template-columns:1fr}
 .search{max-width:none;flex:1}
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="orb one"></div><div class="orb two"></div>

<div id="loginView" class="login-wrap">
 <form id="loginForm" class="login">
  <div class="logo">W</div>
  <h1>فرماندهی کل WORLD AT ARMS</h1>
  <p class="muted">SUPREME ADMINISTRATION CENTER</p>
  <div class="field"><label>ایمیل مدیر</label><input id="email" type="email" required autocomplete="username"></div>
  <div class="field"><label>رمز عبور</label><input id="password" type="password" required autocomplete="current-password"></div>
  <button class="btn primary" style="width:100%" type="submit">ورود به مرکز فرماندهی</button>
  <p id="loginError" class="muted"></p>
  <div class="notice">ورود فقط برای حسابی مجاز است که در فهرست مدیران دیتابیس ثبت شده باشد.</div>
 </form>
</div>

<div id="app" class="shell hidden">
 <aside class="side" id="sidebar">
  <div class="brand"><div class="logo">W</div><div><strong>WORLD AT ARMS</strong><small>SUPREME COMMAND</small></div></div>
  <nav class="nav" id="nav">
   <button class="active" data-page="dashboard"><span>◈</span>داشبورد مرکزی</button>
   <button data-page="worlds"><span>🌐</span>جهان‌ها</button>
   <button data-page="countries"><span>🏳</span>کشورها</button>
   <button data-page="players"><span>👤</span>بازیکنان</button>
   <button data-page="purchases"><span>💳</span>درخواست خرید</button>
   <button data-page="economy"><span>◉</span>اقتصاد و تراکنش‌ها</button>
   <button data-page="messages"><span>✉</span>مرکز پیام‌ها</button>
   <button data-page="warnings"><span>⚑</span>اخطارها</button>
   <button data-page="resolutions"><span>▤</span>قطعنامه‌ها</button>
   <button data-page="logs"><span>◷</span>گزارش فعالیت</button>
  </nav>
  <div class="side-foot">
   <button class="btn" id="logoutBtn" style="width:100%">خروج امن از پنل</button>
   <p class="muted" style="text-align:center;margin-top:12px">ADMIN ACCESS · VERIFIED</p>
  </div>
 </aside>
 <div id="mobileOverlay" class="mobile-overlay"></div>
 <main class="main">
  <header class="top">
   <div style="display:flex;gap:10px;align-items:center">
    <button class="btn mobile-menu" id="menuBtn">☰</button>
    <div><h1 id="pageTitle">داشبورد مرکزی</h1><p id="pageSub">وضعیت لحظه‌ای سامانه مدیریت</p></div>
   </div>
   <div class="top-actions">
    <span class="connection">● اتصال پنل</span>
    <button class="btn" id="refreshBtn">↻ بروزرسانی</button>
   </div>
  </header>
  <section id="pageContent"><div class="loading">در حال اتصال...</div></section>
 </main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modalRoot"></div>

<script>
/* =========================
   CONFIGURATION
========================= */
const SUPABASE_URL = 'https://hgaliwladnrtfdkwbtzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UNoDUa2CHIf4SUbjygOR6g__l3Q0Ezb';
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let adminId=null,currentPage='dashboard',worlds=[],countries=[];
const $=s=>document.querySelector(s);
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString('fa-IR'):'—';

function toast(message){
 const t=$('#toast');t.textContent=message;t.classList.remove('hidden');
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3500);
}
function fail(e){console.error(e);toast(e?.message||'خطای نامشخص');}
function ask(message){return window.confirm(message);}
function modal(title,body){
 $('#modalRoot').innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal">
 <h2>${esc(title)}</h2>${body}<div class="modal-actions">
 <button class="btn" id="modalCancel">انصراف</button>
 <button class="btn primary" id="modalSave">ثبت نهایی</button>
 </div></div></div>`;
 $('#modalCancel').onclick=closeModal;
 $('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
}
function closeModal(){$('#modalRoot').innerHTML=''}
async function verifyAdmin(){
 const {data,error}=await db.rpc('is_waa_admin');
 if(error)throw error;
 if(data!==true)throw new Error('این حساب مدیر مجاز نیست.');
}
async function enter(session){
 await verifyAdmin();adminId=session.user.id;
 $('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');
 await navigate('dashboard');
}
async function init(){
 const {data:{session},error}=await db.auth.getSession();
 if(error)throw error;
 if(session){try{await enter(session)}catch(e){await db.auth.signOut();$('#loginError').textContent=e.message}}
}
$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='در حال بررسی...';
 try{
  const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  if(error)throw error;await enter(data.session);
 }catch(e){$('#loginError').textContent=e.message||'ورود ناموفق بود'}
 finally{b.disabled=false;b.textContent='ورود به مرکز فرماندهی'}
});
$('#logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#mobileOverlay').onclick=()=>$('#sidebar').classList.remove('open');
$('#refreshBtn').onclick=()=>renderPage(currentPage).catch(fail);
$('#nav').addEventListener('click',e=>{
 const b=e.target.closest('[data-page]');if(!b)return;
 $('#sidebar').classList.remove('open');navigate(b.dataset.page).catch(fail);
});

const titles={
 dashboard:['داشبورد مرکزی','وضعیت کلی جهان‌ها و سامانه'],
 worlds:['مدیریت جهان‌ها','ساخت، ویرایش، ریست و حذف جهان'],
 countries:['مدیریت کشورها','مالکیت، وضعیت و اقتصاد کشورها'],
 players:['مدیریت بازیکنان','بازیکنان ثبت‌شده در جهان‌ها'],
 purchases:['درخواست خرید','بررسی و تصمیم‌گیری درخواست‌ها'],
 economy:['اقتصاد و تراکنش‌ها','کنترل موجودی و سوابق مالی'],
 messages:['مرکز پیام‌ها','ثبت پیام در صف ارسال بازی'],
 warnings:['اخطارهای مدیریتی','ثبت و پیگیری اخطارها'],
 resolutions:['مرکز قطعنامه‌ها','مدیریت قطعنامه‌های جهان‌ها'],
 logs:['گزارش فعالیت','سوابق ثبت‌شده در دیتابیس']
};
async function loadBase(){
 const [w,c]=await Promise.all([
  db.from('worlds').select('*').order('created_at',{ascending:false}),
  db.from('countries').select('*').order('name')
 ]);
 if(w.error)throw w.error;if(c.error)throw c.error;
 worlds=w.data||[];countries=c.data||[];
}
async function table(name){
 const {data,error}=await db.from(name).select('*').order('created_at',{ascending:false}).limit(300);
 if(error)throw error;return data||[];
}
function worldName(id){return worlds.find(x=>x.id===id)?.name||'—'}
function countryName(id){return countries.find(x=>x.id===id)?.name||'—'}
function pill(v){
 const cls=({active:'green',approved:'green',resolved:'green',sent:'green',pending:'gold',queued:'gold',important:'gold',critical:'red',rejected:'red',failed:'red',inactive:'red'})[v]||'';
 return `<span class="pill ${cls}">${esc(v||'—')}</span>`;
}
function panel(title,body,tools=''){
 return `<div class="panel"><div class="panel-head"><h2>${title}</h2><div class="toolbar">${tools}</div></div>${body}</div>`;
}
function tableHTML(headers,rows){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
 ${rows.length?rows.join(''):`<tr><td class="empty" colspan="${headers.length}">اطلاعاتی وجود ندارد.</td></tr>`}
 </tbody></table></div>`;
}
function worldSelect(id='worldSelect',selected=''){
 return `<select id="${id}"><option value="">انتخاب جهان</option>${worlds.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`;
}
function countrySelect(id='countrySelect',worldId='',selected=''){
 const list=countries.filter(c=>!worldId||c.world_id===worldId);
 return `<select id="${id}"><option value="">انتخاب کشور</option>${list.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
}
async function navigate(page){
 currentPage=page;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 $('#pageTitle').textContent=titles[page][0];$('#pageSub').textContent=titles[page][1];
 await renderPage(page);
}
async function renderPage(page){
 $('#pageContent').innerHTML='<div class="loading">در حال دریافت اطلاعات...</div>';
 await loadBase();let html='';
 if(page==='dashboard'){
  const [pr,wa,msg,logs,tx,res]=await Promise.all([
   table('purchase_requests'),table('admin_warnings'),table('game_messages'),
   table('activity_logs'),table('wallet_transactions'),table('resolutions')
  ]);
  const stats=[
   ['جهان‌ها',worlds.length,'🌐'],['کشورها',countries.length,'🏳'],
   ['بازیکنان',countries.filter(c=>c.player_telegram_id).length,'👤'],
   ['خریدهای در انتظار',pr.filter(x=>x.status==='pending').length,'💳'],
   ['اخطارهای فعال',wa.filter(x=>x.status==='active').length,'⚑'],
   ['پیام‌های صف',msg.filter(x=>x.status==='queued').length,'✉'],
   ['تراکنش‌ها',tx.length,'◉'],['قطعنامه‌ها',res.length,'▤']
  ];
  html=`<div class="stats">${stats.map(s=>`<div class="stat"><div class="cap">${s[2]} ${s[0]}</div><strong>${fa(s[1])}</strong></div>`).join('')}</div>`;
  html+=panel('وضعیت جهان‌ها',tableHTML(['نام جهان','وضعیت','کشورها','بازیکنان','تاریخ ساخت'],
   worlds.map(w=>`<tr><td>${esc(w.name)}</td><td>${pill(w.status)}</td><td>${fa(countries.filter(c=>c.world_id===w.id).length)}</td><td>${fa(countries.filter(c=>c.world_id===w.id&&c.player_telegram_id).length)}</td><td>${date(w.created_at)}</td></tr>`)));
  html+=panel('آخرین فعالیت‌ها',tableHTML(['نوع','توضیحات','تاریخ'],
   logs.slice(0,8).map(x=>`<tr><td>${esc(x.event_type)}</td><td>${esc(x.description)}</td><td>${date(x.created_at)}</td></tr>`)));
 }
 if(page==='worlds'){
  html=panel('ساخت جهان','<div class="grid2"><div class="field"><label>نام جهان</label><input id="newWorldName" placeholder="مثلاً Europe 1936"></div><div class="field"><label>توضیحات</label><input id="newWorldDesc" placeholder="توضیحات جهان"></div></div><button class="btn primary" id="createWorld">+ ساخت جهان</button>');
  html+=panel('فهرست جهان‌ها',tableHTML(['جهان','توضیحات','وضعیت','کشورها','عملیات'],
   worlds.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.description)}</td><td>${pill(w.status)}</td><td>${fa(countries.filter(c=>c.world_id===w.id).length)}</td><td><div class="actions">
   <button class="btn small" data-edit-world="${w.id}">ویرایش</button>
   <button class="btn small gold" data-toggle-world="${w.id}">${w.status==='active'?'غیرفعال‌سازی':'فعال‌سازی'}</button>
   <button class="btn small" data-reset-world="${w.id}">ریست همه کشورها</button>
   <button class="btn small danger" data-delete-world="${w.id}">حذف جهان</button>
   </div></td></tr>`)));
 }
 if(page==='countries'){
  html=panel('افزودن کشور',`<div class="grid2"><div class="field"><label>جهان</label>${worldSelect('newCountryWorld')}</div><div class="field"><label>نام کشور</label><input id="newCountryName" placeholder="نام کشور"></div><div class="field"><label>فرمانروا</label><input id="newCountryRuler" placeholder="نام فرمانروا"></div><div class="field"><label>موجودی اولیه</label><input id="newCountryBalance" type="number" value="0" min="0"></div><div class="field"><label>قیمت کشور ویژه</label><input id="newCountryPrice" type="number" value="500000" min="0"></div><div class="field"><label>نوع کشور</label><select id="newCountryPremium"><option value="false">عادی</option><option value="true">ویژه</option></select></div></div><button class="btn primary" id="createCountry">+ افزودن کشور</button>`);
  html+=panel('فهرست کشورها',tableHTML(
   ['کشور','جهان','فرمانروا','بازیکن','موجودی','الماس','ویژه','قفل','عملیات'],
   countries.map(c=>`<tr>
   <td>${esc(c.name)}</td>
   <td>${esc(worldName(c.world_id))}</td>

========================= */
async function changeDiamonds(id){
 const c=countries.find(x=>x.id===id);
 if(!c)return;

 modal('💎 مدیریت الماس '+c.name,`
  <div class="notice">
   موجودی فعلی الماس:
   <strong class="diamond-value">${fa(c.diamonds)} 💎</strong>
  </div>
  <div class="field">
   <label>نوع عملیات</label>
   <select id="mDiamondOp">
    <option value="credit">افزایش الماس</option>
    <option value="debit">کاهش الماس</option>
   </select>
  </div>
  <div class="field">
   <label>تعداد الماس</label>
   <input id="mDiamondAmount" type="number" min="1" step="1" placeholder="تعداد الماس">
  </div>
  <div class="field">
   <label>دلیل تغییر</label>
   <input id="mDiamondReason" placeholder="مثلاً پاداش مدیریتی">
  </div>
 `);

 $('#modalSave').onclick=async()=>{
  const saveButton=$('#modalSave');
  try{
   const amount=Number($('#mDiamondAmount').value);
   const reason=$('#mDiamondReason').value.trim();
   const operation=$('#mDiamondOp').value;

   if(!Number.isSafeInteger(amount)||amount<=0||!reason)
    throw Error('تعداد الماس و دلیل معتبر وارد کن.');

   const actionText=operation==='credit'?'اضافه':'کسر';

   if(!ask(`${fa(amount)} الماس به کشور ${c.name} ${actionText} شود؟`))
    return;

   saveButton.disabled=true;
   saveButton.textContent='در حال ثبت...';

   const {error}=await db.rpc('admin_adjust_diamonds',{
    p_country_id:id,
    p_amount:amount,
    p_reason:reason,
    p_operation:operation
   });

   if(error)throw error;

   closeModal();
   toast('موجودی الماس با موفقیت تغییر کرد.');
   await renderPage('countries');

  }catch(e){
   if(saveButton && saveButton.isConnected){
    saveButton.disabled=false;
    saveButton.textContent='ثبت نهایی';
   }
   fail(e);
  }
 }
}

async function editResolution(id){
 const rows=await table('resolutions'),r=rows.find(x=>x.id===id);if(!r)return;
 modal('ویرایش وضعیت قطعنامه',`<p>${esc(r.title)}</p><div class="field"><label>وضعیت</label><select id="mResStatus">
  <option value="draft">پیش‌نویس</option><option value="pending">در انتظار</option>
  <option value="approved">تأییدشده</option><option value="rejected">ردشده</option></select></div>`);
 $('#mResStatus').value=r.status;
 $('#modalSave').onclick=async()=>{
  try{const {error}=await db.from('resolutions').update({status:$('#mResStatus').value,updated_at:new Date().toISOString()}).eq('id',id);
   if(error)throw error;closeModal();toast('وضعیت تغییر کرد.');await renderPage('resolutions');
  }catch(e){fail(e)}
 };
}
async function deleteResolution(id){
 if(!ask('قطعنامه حذف شود؟'))return;
 const {error}=await db.from('resolutions').delete().eq('id',id);
 if(error)throw error;toast('قطعنامه حذف شد.');await renderPage('resolutions');
}

/* =========================
   PAGE EVENT BINDINGS
========================= */
function bindPageEvents(page){
 const on=(selector,fn)=>{const el=$(selector);if(el)el.onclick=()=>Promise.resolve(fn()).catch(fail)};
 if(page==='worlds'){
  on('#createWorld',createWorld);
  document.querySelectorAll('[data-edit-world]').forEach(b=>b.onclick=()=>editWorld(b.dataset.editWorld));
  document.querySelectorAll('[data-toggle-world]').forEach(b=>b.onclick=()=>toggleWorld(b.dataset.toggleWorld).catch(fail));
  document.querySelectorAll('[data-reset-world]').forEach(b=>b.onclick=()=>resetWorld(b.dataset.resetWorld).catch(fail));
  document.querySelectorAll('[data-delete-world]').forEach(b=>b.onclick=()=>deleteWorld(b.dataset.deleteWorld).catch(fail));
 }
 if(page==='countries'){
  on('#createCountry',createCountry);
  document.querySelectorAll('[data-edit-country]').forEach(b=>b.onclick=()=>editCountry(b.dataset.editCountry));
  document.querySelectorAll('[data-balance]').forEach(b=>b.onclick=()=>changeBalance(b.dataset.balance));
  document.querySelectorAll('[data-diamonds]').forEach(b=>b.onclick=()=>changeDiamonds(b.dataset.diamonds));
  document.querySelectorAll('[data-reset-country]').forEach(b=>b.onclick=()=>resetCountry(b.dataset.resetCountry).catch(fail));
  document.querySelectorAll('[data-delete-country]').forEach(b=>b.onclick=()=>deleteCountry(b.dataset.deleteCountry).catch(fail));
  document.querySelectorAll('[data-lock-country]').forEach(b=>b.onclick=()=>toggleLock(b.dataset.lockCountry).catch(fail));
  const search=$('#countrySearch');if(search)search.oninput=()=>{
   const q=search.value.toLowerCase();
   document.querySelectorAll('#pageContent tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none');
  };
 }
 if(page==='players')on('#transferBtn',transferPlayer);
 if(page==='purchases')document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewPurchase(b.dataset.review,b.dataset.decision).catch(fail));
 if(page==='economy'){
  const w=$('#ecoWorld'),c=$('#ecoCountry');
  w.onchange=()=>{c.innerHTML=countrySelect('unused',w.value).replace('<select id="unused">','').replace('</select>','')};
  on('#ecoSubmit',submitEconomy);
 }
 if(page==='messages')on('#sendMessage',createMessage);
 if(page==='warnings'){
  on('#createWarning',createWarning);
  document.querySelectorAll('[data-resolve-warning]').forEach(b=>b.onclick=()=>resolveWarning(b.dataset.resolveWarning).catch(fail));
  const w=$('#warnWorld'),c=$('#warnCountry');
  w.onchange=()=>{c.innerHTML=countrySelect('unused',w.value).replace('<select id="unused">','').replace('</select>','')};
 }
 if(page==='resolutions'){
  on('#createResolution',createResolution);
  document.querySelectorAll('[data-edit-resolution]').forEach(b=>b.onclick=()=>editResolution(b.dataset.editResolution));
  document.querySelectorAll('[data-delete-resolution]').forEach(b=>b.onclick=()=>deleteResolution(b.dataset.deleteResolution).catch(fail));
 }
}

/* =========================
   ANIMATED SPACE BACKGROUND
========================= */
(function(){
 const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');
 let width,height,stars=[];
 function resize(){
  width=canvas.width=innerWidth*devicePixelRatio;
  height=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  width=innerWidth;height=innerHeight;
  stars=Array.from({length:Math.min(180,Math.floor(width/7))},()=>({
   x:Math.random()*width,y:Math.random()*height,
   r:Math.random()*1.5+.25,s:Math.random()*.35+.08,
   a:Math.random()*.7+.2,p:Math.random()*6
  }));
 }
 function draw(){
  ctx.clearRect(0,0,width,height);
  for(const s of stars){
   s.y+=s.s;if(s.y>height){s.y=0;s.x=Math.random()*width}
   s.p+=.025;
   const alpha=s.a*(.55+.45*Math.sin(s.p));
   ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
   ctx.fillStyle=`rgba(170,205,255,${alpha})`;ctx.fill();
  }
  requestAnimationFrame(draw);
 }
 addEventListener('resize',resize);resize();draw();
})();

init().catch(fail);
</script>
</body>
