
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf4ff">
<title>WORLD AT ARMS | Admin Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{
 --bg:#f3f8ff;--white:#fff;--ink:#20344f;--muted:#7c8da5;
 --blue:#6ca9e9;--pale:#e8f3ff;--line:#e4edf7;
 --green:#27a879;--red:#e46b78;--gold:#c39138;
 --shadow:0 12px 35px #8eafd01a;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f3f8ff,#eef6ff 55%,#f8fbff);font-family:Vazirmatn,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}
.logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#83bdf5,#c6e2ff);display:grid;place-items:center;color:#fff;font-size:25px;font-weight:900}
.login h1{font-size:23px;margin:18px 0 4px}
.muted{color:var(--muted);font-size:13px}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea,.search{
 width:100%;border:1px solid var(--line);background:#fbfdff;
 border-radius:13px;padding:11px 13px;outline:none;color:var(--ink)
}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{
 border-color:#8bbcf0;box-shadow:0 0 0 3px #8bbcf022
}
.btn{padding:10px 15px;border-radius:12px;background:var(--pale);color:#3678b9;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#72afea,#8cc5f5);color:white}
.btn.danger{background:#fff0f1;color:#c94c5b}
.btn.good{background:#e8faf3;color:#16865f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.side{background:#fff;border-left:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand .logo{width:43px;height:43px;border-radius:15px;font-size:19px}
.brand strong{display:block;font-size:14px}
.brand small{color:var(--muted);font-size:11px}
.nav{display:grid;gap:5px}
.nav button{background:transparent;text-align:right;padding:11px 13px;border-radius:13px;color:#71849d;font-weight:600}
.nav button.active,.nav button:hover{background:#eaf4ff;color:#367fbe}
.nav button span{display:inline-block;width:28px}
.side-foot{position:absolute;bottom:18px;right:15px;left:15px}
.main{padding:25px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}
.top h1{font-size:22px;margin:0}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:9px;align-items:center}
.avatar{width:38px;height:38px;border-radius:13px;background:#e8f3ff;color:#4387c7;display:grid;place-items:center;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.stat{padding:17px}
.stat .cap{color:var(--muted);font-size:12px}
.stat strong{display:block;font-size:26px;margin-top:8px}
.panel{padding:18px;margin-bottom:15px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{max-width:250px;padding:9px 12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
th{text-align:right;color:#8292a7;font-weight:600;background:#f8fbff}
td,th{padding:11px;border-bottom:1px solid #edf2f8}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:4px 9px;border-radius:30px;font-size:11px;background:#edf5ff;color:#5489bc}
.green{background:#e8faf3;color:#16865f}
.red{background:#fff0f1;color:#c94c5b}
.gold{background:#fff7e7;color:#b7842f}
.empty,.loading{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:12px;background:#fff8e9;color:#9b762e;font-size:12px;margin:12px 0}
.toast{position:fixed;bottom:22px;left:22px;background:#20344f;color:white;padding:12px 17px;border-radius:13px;z-index:10;max-width:90vw}
.mobile-menu{display:none}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;z-index:8;right:0;top:0;width:255px;transform:translateX(105%);transition:.25s;box-shadow:var(--shadow)}
 .side.open{transform:translateX(0)}
 .mobile-menu{display:inline-flex}
 .main{padding:17px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
 .main{padding:13px}
 .top h1{font-size:18px}
 .stats{gap:8px}
 .stat{padding:12px}
 .stat strong{font-size:22px}
 .panel{padding:13px}
 .search{max-width:none;flex:1}
}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
 <form id="loginForm" class="login">
  <div class="logo">W</div>
  <h1>مرکز مدیریت WORLD AT ARMS</h1>
  <p class="muted">با حساب مدیر ثبت‌شده در سامانه وارد شوید.</p>
  <div class="field">
   <label>ایمیل مدیر</label>
   <input id="email" type="email" autocomplete="username" required>
  </div>
  <div class="field">
   <label>رمز عبور</label>
   <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn primary" style="width:100%;margin-top:8px" type="submit">ورود امن به پنل</button>
  <p class="muted" id="loginError"></p>
  <div class="notice">ورود فقط برای حسابی مجاز است که شناسه آن در جدول مدیران ثبت شده باشد.</div>
 </form>
</div>

<div id="app" class="shell hidden">
 <aside class="side" id="sidebar">
  <div class="brand">
   <div class="logo">W</div>
   <div><strong>WORLD AT ARMS</strong><small>ADMIN CONTROL CENTER</small></div>
  </div>
  <nav class="nav" id="nav">
   <button class="active" data-page="dashboard"><span>▦</span>داشبورد</button>
   <button data-page="worlds"><span>🌐</span>جهان‌ها</button>
   <button data-page="countries"><span>🏳</span>کشورها</button>
   <button data-page="players"><span>👤</span>بازیکنان</button>
   <button data-page="purchases"><span>🛒</span>درخواست خرید</button>
   <button data-page="economy"><span>◈</span>اقتصاد و تراکنش‌ها</button>
   <button data-page="messages"><span>✉</span>پیام‌های بازی</button>
   <button data-page="warnings"><span>⚑</span>اخطارها</button>
   <button data-page="resolutions"><span>▤</span>قطعنامه‌ها</button>
   <button data-page="logs"><span>◷</span>گزارش فعالیت</button>
  </nav>
  <div class="side-foot">
   <button class="btn" id="logoutBtn" style="width:100%">خروج از حساب ↗</button>
  </div>
 </aside>

 <main class="main">
  <header class="top">
   <div style="display:flex;gap:10px;align-items:center">
    <button class="btn mobile-menu" id="menuBtn">☰</button>
    <div>
     <h1 id="pageTitle">داشبورد مدیریتی</h1>
     <p id="pageSub">نمای کلی وضعیت بازی و سرور</p>
    </div>
   </div>
   <div class="top-actions">
    <button class="btn" id="refreshBtn">↻ بروزرسانی</button>
    <div class="avatar">A</div>
   </div>
  </header>
  <section id="pageContent"><div class="loading">در حال دریافت اطلاعات...</div></section>
 </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = 'https://hgaliwladnrtfdkwbtzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UNoDUa2CHIf4SUbjygOR6g__l3Q0Ezb';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let adminId = null;
let currentPage = 'dashboard';
let worlds = [];
let countries = [];

const $ = s => document.querySelector(s);

const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));

const fa = n => Number(n || 0).toLocaleString('fa-IR');

function toast(message){
 const box = $('#toast');
 box.textContent = message;
 box.classList.remove('hidden');
 setTimeout(() => box.classList.add('hidden'), 3500);
}

function fail(error){
 console.error(error);
 toast(error?.message || 'خطایی رخ داد.');
}

async function verifyAdmin(){
 const {data,error} = await db.rpc('is_waa_admin');
 if(error) throw error;
 if(data !== true) throw new Error('این حساب در فهرست مدیران بازی ثبت نشده است.');
}

async function enter(session){
 await verifyAdmin();
 adminId = session.user.id;
 $('#loginView').classList.add('hidden');
 $('#app').classList.remove('hidden');
 await navigate('dashboard');
}

async function init(){
 const {data:{session}} = await db.auth.getSession();
 if(session){
  try{ await enter(session); }
  catch(e){
   await db.auth.signOut();
   $('#loginError').textContent = e.message;
  }
 }
}

$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const button = e.submitter;
 button.disabled = true;
 button.textContent = 'در حال ورود...';

 try{
  const {data,error} = await db.auth.signInWithPassword({
   email:$('#email').value.trim(),
   password:$('#password').value
  });
  if(error) throw error;
  await enter(data.session);
 }catch(error){
  $('#loginError').textContent = error.message || 'ورود ناموفق بود.';
 }finally{
  button.disabled = false;
  button.textContent = 'ورود امن به پنل';
 }
});

$('#logoutBtn').onclick = async()=>{
 await db.auth.signOut();
 location.reload();
};

$('#menuBtn').onclick = ()=>$('#sidebar').classList.toggle('open');

$('#refreshBtn').onclick = ()=>renderPage(currentPage).catch(fail);

$('#nav').addEventListener('click',e=>{
 const button = e.target.closest('button[data-page]');
 if(!button) return;
 $('#sidebar').classList.remove('open');
 navigate(button.dataset.page).catch(fail);
});

const titles = {
 dashboard:['داشبورد مدیریتی','نمای کلی وضعیت بازی و سرور'],
 worlds:['مدیریت جهان‌ها','ساخت و کنترل جهان‌های بازی'],
 countries:['مدیریت کشورها','اطلاعات و تنظیمات کشورهای هر جهان'],
 players:['بازیکنان','بازیکنان ثبت‌شده بر اساس کشور انتخاب‌شده'],
 purchases:['درخواست‌های خرید','بررسی درخواست خرید کشور ویژه'],
 economy:['اقتصاد و تراکنش‌ها','مدیریت موجودی و سوابق مالی'],
 messages:['پیام‌های بازی','ثبت پیام سراسری، جهانی یا خصوصی'],
 warnings:['اخطارهای مدیریتی','ثبت و پیگیری اخطارها'],
 resolutions:['قطعنامه‌ها','مدیریت قطعنامه‌های جهان‌ها'],
 logs:['گزارش فعالیت','رویدادهای ثبت‌شده در سامانه']
};

async function loadTable(table){
 const {data,error} = await db.from(table)
  .select('*')
  .order('created_at',{ascending:false})
  .limit(250);
 if(error) throw error;
 return data || [];
}

async function loadBase(){
 const [w,c] = await Promise.all([
  db.from('worlds').select('*').order('created_at',{ascending:false}),
  db.from('countries').select('*').order('name')
 ]);
 if(w.error) throw w.error;
 if(c.error) throw c.error;
 worlds = w.data || [];
 countries = c.data || [];
}

function statusPill(status){
 const cls = ({
  active:'green',approved:'green',sent:'green',resolved:'green',
  rejected:'red',failed:'red',critical:'red',
  important:'gold',pending:'gold',queued:'gold',inactive:'red'
 })[status] || '';
 return '<span class="pill '+cls+'">'+esc(status || '—')+'</span>';
}

function panel(title,body,tools=''){
 return '<div class="panel"><div class="panel-head"><h2>'+title+'</h2><div class="toolbar">'+tools+'</div></div>'+body+'</div>';
}

function makeTable(headers,rows){
 return '<div class="table-wrap"><table><thead><tr>'+
 headers.map(x=>'<th>'+x+'</th>').join('')+
 '</tr></thead><tbody>'+
 (rows.length ? rows.join('') :
 '<tr><td class="empty" colspan="'+headers.length+'">موردی برای نمایش وجود ندارد.</td></tr>')+
 '</tbody></table></div>';
}

function worldName(id){
 return worlds.find(x=>x.id===id)?.name || '—';
}

function worldSelect(){
 return '<select id="fWorld"><option value="">انتخاب جهان</option>'+
 worlds.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('')+
 '</select>';
}

async function navigate(page){
 currentPage = page;
 document.querySelectorAll('#nav button').forEach(button=>{
  button.classList.toggle('active',button.dataset.page===page);
 });
 $('#pageTitle').textContent = titles[page][0];
 $('#pageSub').textContent = titles[page][1];
 await renderPage(page);
}

async function renderPage(page){
 $('#pageContent').innerHTML = '<div class="loading">در حال بارگذاری...</div>';
 await loadBase();

 let html = '';

 if(page === 'dashboard'){
  const [purchases,warnings,messages,logs] = await Promise.all([
   loadTable('purchase_requests'),
   loadTable('admin_warnings'),
   loadTable('game_messages'),
   loadTable('activity_logs')
  ]);

  const stats = [
   ['جهان‌ها',worlds.length],
   ['کشورها',countries.length],
   ['بازیکنان',countries.filter(c=>c.player_telegram_id).length],
   ['خریدهای در انتظار',purchases.filter(x=>x.status==='pending').length]
  ];

  html = '<div class="stats">'+stats.map(x=>
   '<div class="stat"><div class="cap">'+x[0]+'</div><strong>'+fa(x[1])+'</strong></div>'
  ).join('')+'</div>';

  html += panel('خلاصه سامانه',
   '<div class="stats" style="margin:0">'+[
    ['اخطار فعال',warnings.filter(x=>x.status==='active').length],
    ['پیام‌ها',messages.length],
    ['گزارش‌ها',logs.length],
    ['جهان فعال',worlds.filter(x=>x.status==='active').length]
   ].map(x=>'<div class="stat"><div class="cap">'+x[0]+'</div><strong>'+fa(x[1])+'</strong></div>').join('')+
   '</div>'
  );

  html += panel('جهان‌ها',makeTable(
   ['نام','وضعیت','تعداد کشور'],
   worlds.map(w=>'<tr><td>'+esc(w.name)+'</td><td>'+statusPill(w.status)+'</td><td>'+
   fa(countries.filter(c=>c.world_id===w.id).length)+'</td></tr>')
  ));
 }

 if(page === 'worlds'){
  html = panel('فهرست جهان‌ها',makeTable(
   ['نام','توضیحات','وضعیت','کشورها','عملیات'],
   worlds.map(w=>'<tr><td>'+esc(w.name)+'</td><td>'+esc(w.description)+'</td><td>'+
    statusPill(w.status)+'</td><td>'+fa(countries.filter(c=>c.world_id===w.id).length)+
    '</td><td><button class="btn" data-edit-world="'+w.id+'">ویرایش</button> '+
    '<button class="btn danger" data-toggle-world="'+w.id+'">'+
    (w.status==='active'?'غیرفعال':'فعال')+'</button></td></tr>')
  ),'<button class="btn primary" id="addWorld">+ ساخت جهان</button>');
 }

 if(page === 'countries'){
  html = panel('کشورها',makeTable(
   ['کشور','جهان','فرمانروا','بازیکن','موجودی','وضعیت','عملیات'],
   countries.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(worldName(c.world_id))+
    '</td><td>'+esc(c.ruler||'—')+'</td><td>'+
    esc(c.player_telegram_username||c.player_telegram_id||'بدون بازیکن')+
    '</td><td>'+fa(c.balance)+'</td><td>'+statusPill(c.is_locked?'inactive':'active')+
    '</td><td><button class="btn" data-edit-country="'+c.id+'">ویرایش</button> '+
    '<button class="btn" data-balance="'+c.id+'">تغییر موجودی</button></td></tr>')
  ),'<input class="search" id="countrySearch" placeholder="جستجوی کشور"> '+
  '<button class="btn primary" id="addCountry">+ افزودن کشور</button>');
 }

 if(page === 'players'){
  const players = countries.filter(c=>c.player_telegram_id);
  html = panel('فهرست بازیکنان',makeTable(
   ['شناسه تلگرام','نام کاربری','کشور','جهان','موجودی'],
   players.map(c=>'<tr><td>'+esc(c.player_telegram_id)+'</td><td>'+
    esc(c.player_telegram_username||'—')+'</td><td>'+esc(c.name)+'</td><td>'+
    esc(worldName(c.world_id))+'</td><td>'+fa(c.balance)+'</td></tr>')
  ));
 }

 if(page === 'purchases'){
  const rows = await loadTable('purchase_requests');
  html = panel('درخواست‌های خرید',makeTable(
   ['بازیکن','جهان','کشور','مبلغ','وضعیت','رسید','عملیات'],
   rows.map(x=>'<tr><td>'+esc(x.player_telegram_username||x.player_telegram_id)+
    '</td><td>'+esc(worldName(x.world_id))+'</td><td>'+
    esc(countries.find(c=>c.id===x.country_id)?.name||'—')+'</td><td>'+
    fa(x.price)+'</td><td>'+statusPill(x.status)+'</td><td>'+
    esc(x.receipt_text||'—')+'</td><td>'+
    (x.status==='pending'?
     '<button class="btn good" data-review="'+x.id+'" data-decision="approved">تأیید</button> '+
     '<button class="btn danger" data-review="'+x.id+'" data-decision="rejected">رد</button>':'—')+
    '</td></tr>')
  ));
 }

 if(page === 'economy'){
  const rows = await loadTable('wallet_transactions');
  html = panel('تغییر موجودی',
   '<div class="toolbar">'+worldSelect()+
   '<select id="fCountry"><option value="">انتخاب کشور</option></select>'+
   '<select id="fOperation"><option value="credit">افزایش</option><option value="debit">کاهش</option></select>'+
   '<input id="fAmount" class="search" type="number" min="1" placeholder="مبلغ">'+
   '<input id="fReason" class="search" placeholder="دلیل">'+
   '<button class="btn primary" id="applyBalance">ثبت تغییر</button></div>'+
   '<p class="muted">تغییر موجودی از طریق تابع امن سرور انجام می‌شود.</p>'
  );

  html += panel('تراکنش‌های اخیر',makeTable(
   ['شناسه بازیکن','مبلغ','نوع','دلیل','تاریخ'],
   rows.map(x=>'<tr><td>'+esc(x.player_telegram_id)+'</td><td>'+fa(x.amount)+
    '</td><td>'+statusPill(x.transaction_type)+'</td><td>'+esc(x.reason)+
    '</td><td>'+new Date(x.created_at).toLocaleString('fa-IR')+'</td></tr>')
  ));
 }

 if(page === 'messages'){
  const rows = await loadTable('game_messages');
  html = panel('ثبت پیام جدید',
   '<div class="toolbar">'+worldSelect()+
   '<select id="msgType"><option value="global">سراسری</option>'+
   '<option value="world">جهانی</option><option value="private">خصوصی</option></select>'+
   '<input id="msgPlayer" class="search" placeholder="شناسه تلگرام (خصوصی)"></div>'+
   '<div class="field"><textarea id="msgText" rows="3" placeholder="متن پیام..."></textarea></div>'+
   '<button class="btn primary" id="sendMessage">ثبت در صف ارسال</button>'+
   '<p class="muted">این بخش پیام را در صف ثبت می‌کند. ارسال واقعی تلگرام به پردازشگر ربات وابسته است.</p>'
  );

  html += panel('پیام‌های ثبت‌شده',makeTable(
   ['نوع','متن','وضعیت','زمان'],
   rows.map(x=>'<tr><td>'+statusPill(x.message_type)+'</td><td>'+
    esc(x.message_text)+'</td><td>'+statusPill(x.status)+'</td><td>'+
    new Date(x.created_at).toLocaleString('fa-IR')+'</td></tr>')
  ));
 }

 if(page === 'warnings'){
  const rows = await loadTable('admin_warnings');
  html = panel('ثبت اخطار',
   '<div class="toolbar">'+worldSelect()+
   '<select id="warnCountry"><option value="">بدون کشور مشخص</option></select>'+
   '<select id="warnLevel"><option value="normal">عادی</option>'+
   '<option value="important">مهم</option><option value="critical">بحرانی</option></select></div>'+
   '<div class="field"><textarea id="warnText" rows="3" placeholder="متن اخطار..."></textarea></div>'+
   '<button class="btn primary" id="addWarning">ثبت اخطار</button>'
  );

  html += panel('اخطارها',makeTable(
   ['جهان','کشور','سطح','متن','وضعیت','عملیات'],
   rows.map(x=>'<tr><td>'+esc(worldName(x.world_id))+'</td><td>'+
    esc(countries.find(c=>c.id===x.country_id)?.name||'—')+'</td><td>'+
    statusPill(x.level)+'</td><td>'+esc(x.message)+'</td><td>'+
    statusPill(x.status)+'</td><td>'+
    (x.status==='active'?'<button class="btn good" data-resolve-warning="'+x.id+'">مختومه</button>':'—')+
    '</td></tr>')
  ));
 }

 if(page === 'resolutions'){
  const rows = await loadTable('resolutions');
  html = panel('ثبت قطعنامه',
   '<div class="field">'+worldSelect()+'</div>'+
   '<div class="field"><input id="resTitle" placeholder="عنوان قطعنامه"></div>'+
   '<div class="field"><textarea id="resDesc" rows="3" placeholder="متن قطعنامه"></textarea></div>'+
   '<div class="toolbar"><select id="resStatus">'+
   '<option value="draft">پیش‌نویس</option><option value="pending">در انتظار</option>'+
   '<option value="approved">تأییدشده</option><option value="rejected">ردشده</option>'+
   '</select><button class="btn primary" id="addResolution">ثبت قطعنامه</button></div>'
  );

  html += panel('قطعنامه‌ها',makeTable(
   ['جهان','عنوان','وضعیت','تاریخ','عملیات'],
   rows.map(x=>'<tr><td>'+esc(worldName(x.world_id))+'</td><td>'+
    esc(x.title)+'</td><td>'+statusPill(x.status)+'</td><td>'+
    new Date(x.created_at).toLocaleDateString('fa-IR')+
    '</td><td><button class="btn" data-edit-resolution="'+x.id+'">تغییر وضعیت</button></td></tr>')
  ));
 }

 if(page === 'logs'){
  const rows = await loadTable('activity_logs');
  html = panel('گزارش رویدادها',makeTable(
   ['رویداد','شرح','جهان','کشور','شناسه بازیکن','زمان'],
   rows.map(x=>'<tr><td>'+esc(x.event_type)+'</td><td>'+esc(x.description)+
    '</td><td>'+esc(x.world_name||worldName(x.world_id))+'</td><td>'+
    esc(x.country_name||'—')+'</td><td>'+esc(x.player_telegram_id||'—')+
    '</td><td>'+new Date(x.created_at).toLocaleString('fa-IR')+'</td></tr>')
  ));
 }

 $('#pageContent').innerHTML = html;
 wirePage(page);
}

function wirePage(page){

 if(page === 'worlds'){
  $('#addWorld').onclick = async()=>{
   const name = prompt('نام جهان؟');
   if(!name?.trim()) return;
   const description = prompt('توضیحات جهان؟') || '';
   try{
    const {error} = await db.from('worlds').insert({
     name:name.trim(),description,status:'active'
    });
    if(error) throw error;
    toast('جهان ساخته شد');
    renderPage(page);
   }catch(e){fail(e)}
  };

  document.querySelectorAll('[data-edit-world]').forEach(button=>{
   button.onclick = async()=>{
    const w = worlds.find(x=>x.id===button.dataset.editWorld);
    const name = prompt('نام جهان',w.name);
    if(!name) return;
    const description = prompt('توضیحات',w.description||'') ?? w.description;
    try{
     const {error} = await db.from('worlds').update({name,description}).eq('id',w.id);
     if(error) throw error;
     renderPage(page);
    }catch(e){fail(e)}
   };
  });

  document.querySelectorAll('[data-toggle-world]').forEach(button=>{
   button.onclick = async()=>{
    const w = worlds.find(x=>x.id===button.dataset.toggleWorld);
    if(!confirm('وضعیت جهان تغییر کند؟')) return;
    try{
     const {error} = await db.from('worlds')
      .update({status:w.status==='active'?'inactive':'active'}).eq('id',w.id);
     if(error) throw error;
     renderPage(page);
    }catch(e){fail(e)}
   };
  });
 }

 if(page === 'countries'){
  $('#countrySearch').oninput = e=>{
   document.querySelectorAll('#pageContent tbody tr').forEach(row=>{
    row.style.display = row.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none';
   });
  };

  $('#addCountry').onclick = async()=>{
   const options = worlds.map(w=>w.name+' = '+w.id).join('\n');
   const world_id = prompt('شناسه UUID جهان:\n'+options);
   if(!world_id) return;
   const name = prompt('نام کشور؟');
   if(!name) return;
   try{
    const {error} = await db.from('countries').insert({
     world_id,name,ruler:'',balance:0
    });
    if(error) throw error;
    toast('کشور اضافه شد');
    renderPage(page);
   }catch(e){fail(e)}
  };

  document.querySelectorAll('[data-edit-country]').forEach(button=>{
   button.onclick = async()=>{
    const c = countries.find(x=>x.id===button.dataset.editCountry);
    const name = prompt('نام کشور',c.name);
    if(!name) return;
    const ruler = prompt('فرمانروا',c.ruler||'') ?? c.ruler;
    const price = prompt('قیمت',c.price);
    if(price===null) return;
    const is_locked = confirm('کشور قفل شود؟ (لغو = باز)');
    try{
     const {error} = await db.from('countries')
      .update({name,ruler,price:Number(price),is_locked}).eq('id',c.id);
     if(error) throw error;
     renderPage(page);
    }catch(e){fail(e)}
   };
  });

  document.querySelectorAll('[data-balance]').forEach(button=>{
   button.onclick = ()=>navigate('economy');
  });
 }

 if(page === 'economy'){
  $('#fWorld').onchange = ()=>{
   $('#fCountry').innerHTML = '<option value="">انتخاب کشور</option>'+
    countries.filter(c=>c.world_id===$('#fWorld').value)
    .map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  };

  $('#applyBalance').onclick = async()=>{
   const id = $('#fCountry').value;
   const amount = Number($('#fAmount').value);
   const reason = $('#fReason').value.trim();
   const operation = $('#fOperation').value;

   if(!id || !Number.isSafeInteger(amount) || amount<=0 || !reason){
    return toast('اطلاعات تغییر موجودی کامل نیست.');
   }
   if(!confirm('تغییر موجودی ثبت شود؟')) return;

   try{
    const {data,error} = await db.rpc('admin_adjust_balance',{
     p_country_id:id,
     p_amount:amount,
     p_reason:reason,
     p_operation:operation
    });
    if(error) throw error;
    toast('موجودی جدید: '+fa(data));
    renderPage(page);
   }catch(e){fail(e)}
  };
 }

 if(page === 'purchases'){
  document.querySelectorAll('[data-review]').forEach(button=>{
   button.onclick = async()=>{
    if(!confirm('این درخواست بررسی شود؟')) return;
    try{
     const {data,error} = await db.rpc('admin_review_purchase',{
      p_request_id:button.dataset.review,
      p_decision:button.dataset.decision
     });
     if(error) throw error;
     if(data!==true) throw new Error('عملیات انجام نشد.');
     toast('درخواست بررسی شد');
     renderPage(page);
    }catch(e){fail(e)}
   };
  });
 }

 if(page === 'messages'){
  $('#sendMessage').onclick = async()=>{
   const message_text = $('#msgText').value.trim();
   const message_type = $('#msgType').value;
   const world_id = $('#fWorld').value || null;
   const player_telegram_id = $('#msgPlayer').value.trim() || null;

   if(!message_text) return toast('متن پیام را وارد کنید.');
   if(message_type==='world' && !world_id) return toast('جهان را انتخاب کنید.');
   if(message_type==='private' && !player_telegram_id) return toast('شناسه تلگرام لازم است.');

   try{
    const {error} = await db.from('game_messages').insert({
     message_text,
     message_type,
     world_id:message_type==='global'?null:world_id,
     player_telegram_id:message_type==='private'?player_telegram_id:null,
     status:'queued',
     admin_id:adminId
    });
    if(error) throw error;
    toast('پیام در صف ثبت شد');
    renderPage(page);
   }catch(e){fail(e)}
  };
 }

 if(page === 'warnings'){
  $('#fWorld').onchange = ()=>{
   $('#warnCountry').innerHTML = '<option value="">بدون کشور مشخص</option>'+
    countries.filter(c=>c.world_id===$('#fWorld').value)
    .map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  };

  $('#addWarning').onclick = async()=>{
   const message = $('#warnText').value.trim();
   if(!message) return toast('متن اخطار را وارد کنید.');
   try{
    const {error} = await db.from('admin_warnings').insert({
     world_id:$('#fWorld').value || null,
     country_id:$('#warnCountry').value || null,
     level:$('#warnLevel').value,
     message,
     admin_id:adminId
    });
    if(error) throw error;
    toast('اخطار ثبت شد');
    renderPage(page);
   }catch(e){fail(e)}
  };

  document.querySelectorAll('[data-resolve-warning]').forEach(button=>{
   button.onclick = async()=>{
    try{
     const {error} = await db.from('admin_warnings')
      .update({status:'resolved'}).eq('id',button.dataset.resolveWarning);
     if(error) throw error;
     renderPage(page);
    }catch(e){fail(e)}
   };
  });
 }

 if(page === 'resolutions'){
  $('#addResolution').onclick = async()=>{
   const world_id = $('#fWorld').value;
   const title = $('#resTitle').value.trim();
   if(!world_id || !title) return toast('جهان و عنوان لازم است.');
   try{
    const {error} = await db.from('resolutions').insert({
     world_id,
     title,
     description:$('#resDesc').value,
     status:$('#resStatus').value,
     admin_id:adminId
    });
    if(error) throw error;
    toast('قطعنامه ثبت شد');
    renderPage(page);
   }catch(e){fail(e)}
  };

  document.querySelectorAll('[data-edit-resolution]').forEach(button=>{
   button.onclick = async()=>{
    const status = prompt('وضعیت: draft / pending / approved / rejected');
    if(!['draft','pending','approved','rejected'].includes(status)) return;
    try{
     const {error} = await db.from('resolutions')
      .update({status,updated_at:new Date().toISOString()})
      .eq('id',button.dataset.editResolution);
     if(error) throw error;
     renderPage(page);
    }catch(e){fail(e)}
   };
  });
 }
}

init().catch(fail);
</script>
</body>
</html>
