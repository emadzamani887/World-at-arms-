<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD AT ARMS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#050d1c;
 color:white;
 font-family:Tahoma,Arial,sans-serif;
 overflow-x:hidden;
}

.background{
 position:fixed;
 inset:0;
 z-index:-2;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 45%,#173b64 0%,transparent 55%),
 radial-gradient(ellipse at 10% 10%,#102b4b 0%,transparent 40%),
 linear-gradient(145deg,#030814,#08182b 55%,#020711);
}

.background:before{
 content:"";
 position:absolute;
 inset:-50%;
 background-image:
 radial-gradient(2px 2px at 20% 30%,#fff 98%,transparent),
 radial-gradient(1px 1px at 70% 20%,#b5dfff 98%,transparent),
 radial-gradient(2px 2px at 40% 80%,#fff 98%,transparent),
 radial-gradient(1px 1px at 85% 65%,#a7d8ff 98%,transparent),
 radial-gradient(1px 1px at 15% 75%,#fff 98%,transparent);
 background-size:250px 250px;
 animation:stars 90s linear infinite;
 opacity:.8;
}

@keyframes stars{
 from{transform:translateY(0)}
 to{transform:translateY(250px)}
}

.glow{
 position:absolute;
 width:450px;
 height:450px;
 border-radius:50%;
 filter:blur(100px);
 opacity:.17;
 background:#168cff;
 animation:glow 9s ease-in-out infinite alternate;
}

.glow.one{top:10%;right:-200px}
.glow.two{bottom:-200px;left:-180px;background:#00c8ff;animation-delay:2s}

@keyframes glow{
 from{transform:scale(.8);opacity:.1}
 to{transform:scale(1.3);opacity:.25}
}

.gridbg{
 position:absolute;
 inset:0;
 opacity:.12;
 background-image:
 linear-gradient(#67baff33 1px,transparent 1px),
 linear-gradient(90deg,#67baff33 1px,transparent 1px);
 background-size:45px 45px;
 mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 80%,transparent);
}

.orbit{
 position:absolute;
 width:520px;
 height:520px;
 border:1px solid #5ebaff20;
 border-radius:50%;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 box-shadow:0 0 70px #168cff12,inset 0 0 70px #168cff12;
}

.orbit:before,.orbit:after{
 content:"";
 position:absolute;
 inset:35px;
 border:1px solid #69bfff18;
 border-radius:50%;
}
.orbit:after{inset:90px}

header{
 text-align:center;
 padding:65px 15px 25px;
 position:relative;
}

.logo{
 font-size:clamp(28px,7vw,48px);
 font-weight:900;
 letter-spacing:2px;
 text-shadow:0 0 25px #41aaff99;
}

.subtitle{
 color:#8cb9e5;
 font-size:11px;
 letter-spacing:4px;
 margin-top:12px;
}

.line{
 width:100px;
 height:2px;
 background:linear-gradient(90deg,transparent,#56baff,transparent);
 margin:23px auto;
}

main{
 width:min(650px,92%);
 margin:auto;
 padding-bottom:60px;
 position:relative;
}

.section-title{
 text-align:center;
 margin:20px 0 25px;
}

.section-title h2{
 font-size:21px;
 margin-bottom:9px;
}

.section-title p{
 font-size:12px;
 color:#88a9ca;
}

.worlds{
 display:grid;
 gap:16px;
}

.world-card{
 position:relative;
 overflow:hidden;
 border:1px solid #4b91c455;
 border-radius:17px;
 padding:22px;
 background:linear-gradient(120deg,#102b49dd,#0a1a30ee);
 box-shadow:0 8px 35px #0005, inset 0 0 25px #3a9dff0b;
 transition:.3s;
}

.world-card:before{
 content:"";
 position:absolute;
 width:180px;
 height:180px;
 border-radius:50%;
 background:#168cff;
 filter:blur(80px);
 opacity:.12;
 left:-90px;
 top:-100px;
}

.world-card:hover{
 transform:translateY(-4px);
 border-color:#64baff;
 box-shadow:0 12px 40px #168cff30;
}

.world-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 position:relative;
}

.world-name{
 font-size:18px;
 font-weight:bold;
}

.status{
 background:#123d36;
 color:#72f1c1;
 border:1px solid #36d8a366;
 border-radius:30px;
 padding:6px 11px;
 font-size:10px;
 white-space:nowrap;
}

.world-description{
 color:#9cb7d4;
 font-size:12px;
 line-height:2;
 margin:15px 0;
 position:relative;
}

.world-bottom{
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-top:1px solid #ffffff15;
 padding-top:14px;
 position:relative;
}

.world-count{
 font-size:11px;
 color:#82acd2;
}

.enter{
 border:1px solid #4daeff88;
 color:#fff;
 background:linear-gradient(100deg,#1673bd,#249ee8);
 padding:10px 18px;
 border-radius:9px;
 font-family:inherit;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 18px #168cff35;
}

.enter:active{transform:scale(.96)}

.empty{
 text-align:center;
 padding:40px 15px;
 border:1px dashed #47749d66;
 border-radius:16px;
 color:#9bb8d6;
 font-size:13px;
 line-height:2.5;
 background:#0b1c30aa;
}

#countryPage{display:none}

.back{
 background:#173653;
 border:1px solid #4c83ae66;
 color:#c8e6ff;
 padding:10px 17px;
 border-radius:9px;
 font-family:inherit;
 cursor:pointer;
 margin-bottom:15px;
}

.country{
 background:#102a46;
 border:1px solid #4b91c455;
 border-radius:12px;
 padding:15px;
 margin-bottom:10px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.country-name{font-size:14px;font-weight:bold}
.country-ruler{font-size:10px;color:#90b3d2;margin-top:7px}
.country-state{font-size:10px;color:#80e7bd}

footer{
 text-align:center;
 color:#557b9f;
 font-size:10px;
 padding:20px;
 letter-spacing:2px;
}
</style>
</head>

<body>

<div class="background">
 <div class="gridbg"></div>
 <div class="glow one"></div>
 <div class="glow two"></div>
 <div class="orbit"></div>
</div>

<header>
 <div class="logo">🌍 WORLD AT ARMS</div>
 <div class="subtitle">GLOBAL STRATEGY SIMULATION</div>
 <div class="line"></div>
</header>

<main>

<section id="worldPage">
 <div class="section-title">
  <h2>انتخاب جهان</h2>
  <p>جهان موردنظر خود را برای ورود انتخاب کنید</p>
 </div>
 <div class="worlds" id="worldList"></div>
</section>

<section id="countryPage">
 <button class="back" onclick="backToWorlds()">→ بازگشت به جهان‌ها</button>
 <div class="section-title">
  <h2 id="selectedWorldName">کشورهای جهان</h2>
  <p>کشور موردنظر خود را انتخاب کنید</p>
 </div>
 <div id="countryList"></div>
</section>

</main>

<footer>
WORLD AT ARMS • THE WORLD IS YOURS
</footer>

<script>
const KEY="WAA_FINAL_PANEL_2026";

function getDB(){
 try{
  return JSON.parse(localStorage.getItem(KEY))||{};
 }catch(e){
  return {};
 }
}

function showWorlds(){
 const db=getDB();
 const list=document.getElementById("worldList");
 const worlds=(db.worlds||[]).filter(w=>w.status==="active");

 if(!worlds.length){
  list.innerHTML=`
   <div class="empty">
    <div style="font-size:35px">🌐</div>
    هنوز جهان فعالی ساخته نشده است.<br>
    منتظر ایجاد جهان توسط مدیریت باشید.
   </div>`;
  return;
 }

 list.innerHTML=worlds.map(w=>{
  const count=(db.countries||[]).filter(c=>c.worldId===w.id).length;
  return `
   <div class="world-card">
    <div class="world-top">
     <div class="world-name">🌍 ${safe(w.name)}</div>
     <div class="status">● فعال</div>
    </div>
    <div class="world-description">
     ${safe(w.description||"جهان استراتژیک WORLD AT ARMS")}
    </div>
    <div class="world-bottom">
     <span class="world-count">🏳️ ${count} کشور</span>
     <button class="enter" onclick="openWorld('${safe(w.id)}')">
      ورود به جهان ←
     </button>
    </div>
   </div>`;
 }).join("");
}

function openWorld(worldId){
 const db=getDB();
 const world=(db.worlds||[]).find(w=>w.id===worldId&&w.status==="active");
 if(!world)return alert("این جهان دیگر فعال نیست.");

 document.getElementById("worldPage").style.display="none";
 document.getElementById("countryPage").style.display="block";
 document.getElementById("selectedWorldName").textContent=world.name;

 const countries=(db.countries||[]).filter(c=>c.worldId===worldId);
 const list=document.getElementById("countryList");

 if(!countries.length){
  list.innerHTML='<div class="empty">هنوز کشوری برای این جهان ساخته نشده است.</div>';
  return;
 }

 list.innerHTML=countries.map(c=>`
  <div class="country">
   <div>
    <div class="country-name">🏳️ ${safe(c.name)}</div>
    <div class="country-ruler">فرمانده: ${safe(c.ruler||"تعیین نشده")}</div>
   </div>
   <div class="country-state">
    ${c.playerId?"دارای فرمانده":"آماده انتخاب"}
   </div>
  </div>
 `).join("");
}

function backToWorlds(){
 document.getElementById("countryPage").style.display="none";
 document.getElementById("worldPage").style.display="block";
 showWorlds();
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

showWorlds();
</script>
<script src="script.js"></script>
</body>
</html>
